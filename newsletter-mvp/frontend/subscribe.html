<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작가의아침 - 매일 아침, 작가가 건네는 한 문장</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #fef9e7 0%, #fdebd0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-family: 'Noto Serif KR', serif;
            font-size: 32px;
            color: #e67e22;
            margin-bottom: 10px;
        }

        .tagline {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .quote-preview {
            background: #fef9e7;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            border-left: 4px solid #e67e22;
            text-align: left;
        }

        .quote-text {
            font-family: 'Noto Serif KR', serif;
            font-size: 18px;
            color: #2c3e50;
            line-height: 1.8;
            font-style: italic;
        }

        .quote-author {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 13px;
            text-align: right;
        }

        .description {
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .subscribe-btn {
            background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .subscribe-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(230, 126, 34, 0.3);
        }

        .subscribe-btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 12px;
            color: #888;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">작가의아침</h1>
        <p class="tagline">매일 아침, 작가가 건네는 한 문장</p>

        <div class="quote-preview">
            <p class="quote-text">"사람이 온다는 건 실은 어마어마한 일이다. 그것은 그의 과거와 현재와 그의 미래와 함께 오기 때문이다."</p>
            <p class="quote-author">- 정현종, 《방문객》</p>
        </div>

        <p class="description">
            좋은 책에서 건진 문장 하나가<br>
            당신의 하루를 바꿀 수 있습니다.<br><br>
            매일 아침, 따뜻한 문장을 보내드립니다.
        </p>

        <form class="subscribe-form" onsubmit="subscribe(event)">
            <div class="input-group">
                <input type="text" id="name" placeholder="이름 (선택)">
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="이메일 주소" required>
            </div>
            <button type="submit" class="subscribe-btn">무료로 구독하기</button>
        </form>

        <div id="message" class="message"></div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">&#9993;</div>
                <div class="feature-text">매일 아침 발송</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128214;</div>
                <div class="feature-text">좋은 책 추천</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128274;</div>
                <div class="feature-text">언제든 취소 가능</div>
            </div>
        </div>

        <p class="footer">Copyright 2024 작가의아침. All rights reserved.</p>
    </div>

    <script>
        async function subscribe(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const messageEl = document.getElementById('message');
            const btn = document.querySelector('.subscribe-btn');

            btn.textContent = '처리 중...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });

                const data = await response.json();

                messageEl.className = 'message ' + (data.success ? 'success' : 'error');
                messageEl.textContent = data.message;

                if (data.success) {
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
            }

            btn.textContent = '무료로 구독하기';
            btn.disabled = false;
        }
    </script>
</body>
</html>
