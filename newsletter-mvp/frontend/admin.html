<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작가의아침 - 관리자</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
        }

        .header a {
            color: white;
            text-decoration: none;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .stat-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
        }

        .stat-value.orange { color: #e67e22; }
        .stat-value.green { color: #27ae60; }
        .stat-value.blue { color: #3498db; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e67e22;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(230, 126, 34, 0.3);
        }

        .btn-secondary {
            background: #3498db;
            color: white;
        }

        .btn-secondary:hover {
            background: #2980b9;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .subscriber-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .subscriber-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .subscriber-item:last-child {
            border-bottom: none;
        }

        .subscriber-info h4 {
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
        }

        .subscriber-info p {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-active {
            background: #d4edda;
            color: #155724;
        }

        .badge-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .newsletter-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .newsletter-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .newsletter-item:hover {
            border-color: #e67e22;
            background: #fef9e7;
        }

        .newsletter-item h4 {
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .newsletter-item p {
            font-size: 12px;
            color: #888;
        }

        .newsletter-item .meta {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 11px;
            color: #aaa;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>작가의아침 관리자</h1>
        <a href="/">구독 페이지 보기</a>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">총 구독자</div>
                <div class="stat-value orange" id="totalSubscribers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">활성 구독자</div>
                <div class="stat-value green" id="activeSubscribers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">발송된 뉴스레터</div>
                <div class="stat-value blue" id="sentNewsletters">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">총 발송 이메일</div>
                <div class="stat-value" id="totalEmails">0</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2 class="card-title">새 뉴스레터 작성</h2>
                <form id="newsletterForm" onsubmit="saveNewsletter(event)">
                    <div class="form-group">
                        <label>제목 (비워두면 자동 생성)</label>
                        <input type="text" id="title" placeholder="오늘의 문장 - 2024년 1월 1일">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>책 제목</label>
                            <input type="text" id="bookTitle" placeholder="멈추면, 비로소 보이는 것들">
                        </div>
                        <div class="form-group">
                            <label>저자</label>
                            <input type="text" id="author" placeholder="혜민">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>오늘의 문장 *</label>
                        <textarea id="quote" placeholder="좋은 문장을 입력하세요..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>코멘터리 (선택)</label>
                        <textarea id="commentary" placeholder="문장에 대한 생각이나 해석을 적어주세요..."></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">저장하기</button>
                        <button type="button" class="btn btn-secondary" onclick="saveAndSend()">저장 후 발송</button>
                    </div>
                </form>
                <div id="formMessage" class="message"></div>
            </div>

            <div>
                <div class="card" style="margin-bottom: 20px;">
                    <h2 class="card-title">구독자 목록</h2>
                    <div class="subscriber-list" id="subscriberList">
                        <div class="empty-state">구독자가 없습니다.</div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="card-title">저장된 뉴스레터</h2>
                    <div class="newsletter-list" id="newsletterList">
                        <div class="empty-state">저장된 뉴스레터가 없습니다.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentNewsletterId = null;

        // 페이지 로드 시 데이터 불러오기
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadSubscribers();
            loadNewsletters();
        });

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('totalSubscribers').textContent = data.subscribers.total;
                document.getElementById('activeSubscribers').textContent = data.subscribers.active;
                document.getElementById('sentNewsletters').textContent = data.newsletters.sent;
                document.getElementById('totalEmails').textContent = data.total_emails_sent;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadSubscribers() {
            try {
                const response = await fetch('/api/subscribers');
                const data = await response.json();

                const list = document.getElementById('subscriberList');

                if (data.subscribers.length === 0) {
                    list.innerHTML = '<div class="empty-state">구독자가 없습니다.</div>';
                    return;
                }

                list.innerHTML = data.subscribers.map(sub => `
                    <div class="subscriber-item">
                        <div class="subscriber-info">
                            <h4>${sub.name || '이름 없음'}</h4>
                            <p>${sub.email}</p>
                        </div>
                        <span class="badge ${sub.is_active ? 'badge-active' : 'badge-inactive'}">
                            ${sub.is_active ? '활성' : '비활성'}
                        </span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load subscribers:', error);
            }
        }

        async function loadNewsletters() {
            try {
                const response = await fetch('/api/newsletters');
                const data = await response.json();

                const list = document.getElementById('newsletterList');

                if (data.newsletters.length === 0) {
                    list.innerHTML = '<div class="empty-state">저장된 뉴스레터가 없습니다.</div>';
                    return;
                }

                list.innerHTML = data.newsletters.map(news => `
                    <div class="newsletter-item" onclick="sendNewsletter(${news.id})">
                        <h4>${news.title}</h4>
                        <p>"${news.quote.substring(0, 50)}${news.quote.length > 50 ? '...' : ''}"</p>
                        <div class="meta">
                            <span>${news.book_title || '책 제목 없음'}</span>
                            <span>${news.sent_at ? '발송완료 (' + news.sent_count + '명)' : '미발송'}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load newsletters:', error);
            }
        }

        async function saveNewsletter(event) {
            event.preventDefault();

            const data = {
                title: document.getElementById('title').value,
                book_title: document.getElementById('bookTitle').value,
                author: document.getElementById('author').value,
                quote: document.getElementById('quote').value,
                commentary: document.getElementById('commentary').value
            };

            try {
                const response = await fetch('/api/newsletters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const messageEl = document.getElementById('formMessage');

                messageEl.className = 'message ' + (result.success ? 'success' : 'error');
                messageEl.textContent = result.message;

                if (result.success) {
                    currentNewsletterId = result.newsletter_id;
                    document.getElementById('newsletterForm').reset();
                    loadNewsletters();
                    loadStats();
                }

                return result;
            } catch (error) {
                const messageEl = document.getElementById('formMessage');
                messageEl.className = 'message error';
                messageEl.textContent = '저장에 실패했습니다.';
                return { success: false };
            }
        }

        async function saveAndSend() {
            const result = await saveNewsletter(new Event('submit'));
            if (result.success) {
                await sendNewsletter(result.newsletter_id);
            }
        }

        async function sendNewsletter(newsletterId) {
            if (!confirm('이 뉴스레터를 모든 구독자에게 발송하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch(`/api/newsletters/${newsletterId}/send`, {
                    method: 'POST'
                });

                const result = await response.json();

                alert(result.message);

                if (result.success) {
                    loadNewsletters();
                    loadStats();
                }
            } catch (error) {
                alert('발송에 실패했습니다.');
            }
        }
    </script>
</body>
</html>
