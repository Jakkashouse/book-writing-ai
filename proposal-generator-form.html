<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 출판 기획서 자동 생성기 - 5분 완성</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #E8A849; --accent: #C75B39; --white: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(180deg, #FDF8F2 0%, #FFFCF7 100%); padding: 40px 20px; }
        .container { max-width: 720px; margin: 0 auto; background: var(--white); border-radius: 24px; padding: 48px; box-shadow: 0 12px 40px rgba(45, 42, 38, 0.12); }
        h1 { font-family: 'Nanum Myeongjo', serif; font-size: 36px; color: var(--accent); text-align: center; margin-bottom: 16px; }
        .subtitle { text-align: center; font-size: 20px; color: #5A554E; margin-bottom: 48px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        input, textarea { width: 100%; padding: 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 17px; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { min-height: 200px; resize: vertical; font-family: 'Noto Sans KR', sans-serif; }
        .submit-button { width: 100%; background: linear-gradient(135deg, var(--primary) 0%, #D4942E 100%); color: var(--white); padding: 20px; border: none; border-radius: 60px; font-size: 22px; font-weight: 900; cursor: pointer; margin-top: 16px; }
        .submit-button:hover { transform: translateY(-2px); }
        .loading, .result { display: none; padding: 32px; margin-top: 32px; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result { background: #FDF8F2; border-radius: 16px; }
        .result h2 { font-size: 28px; color: var(--accent); margin-bottom: 24px; }
        .result pre { background: var(--white); padding: 20px; border-radius: 12px; white-space: pre-wrap; line-height: 1.8; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 출판 기획서 자동 생성기</h1>
        <p class="subtitle">제목과 목차만 입력하면 5분 만에 출판사 제출용 기획서 완성</p>

        <form id="proposalForm">
            <div class="form-group">
                <label>저자명 <span style="color: var(--accent);">*</span></label>
                <input type="text" id="author" required placeholder="홍길동">
            </div>
            <div class="form-group">
                <label>이메일 <span style="color: var(--accent);">*</span></label>
                <input type="email" id="email" required placeholder="hong@example.com">
            </div>
            <div class="form-group">
                <label>책 제목 <span style="color: var(--accent);">*</span></label>
                <input type="text" id="title" required placeholder="예: 6주 만에 책쓰기 완성">
            </div>
            <div class="form-group">
                <label>부제</label>
                <input type="text" id="subtitle" placeholder="예: 29년 못 쓴 사람도 2달 만에 출간한 시스템">
            </div>
            <div class="form-group">
                <label>목차 (간단히) <span style="color: var(--accent);">*</span></label>
                <textarea id="outline" required placeholder="예:&#10;1부 - 왜 책을 써야 하나&#10;2부 - 제목과 목차 만들기&#10;3부 - 글쓰기 5+5 시스템&#10;..."></textarea>
            </div>
            <div class="form-group">
                <label>원고 진행률 (%) <span style="color: var(--accent);">*</span></label>
                <input type="number" id="progress" required min="0" max="100" placeholder="80">
            </div>
            <div class="form-group">
                <label>출간 희망일</label>
                <input type="text" id="targetDate" placeholder="예: 2025년 6월">
            </div>
            <div class="form-group">
                <label>예상 페이지</label>
                <input type="number" id="estimatedPages" placeholder="250">
            </div>

            <button type="submit" class="submit-button" id="submitBtn">🚀 출판 기획서 생성하기</button>
        </form>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p style="text-align: center; font-size: 18px;">출판 기획서 생성 중... (약 30초)</p>
        </div>

        <div class="result" id="result">
            <h2>📚 완성된 출판 기획서</h2>
            <pre id="proposalResult"></pre>
            <h2>📊 편집장 평가 리포트</h2>
            <pre id="evaluationResult"></pre>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'http://localhost:5678/webhook/proposal-generator';
        document.getElementById('proposalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('proposalForm').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            const formData = {
                author: document.getElementById('author').value,
                email: document.getElementById('email').value,
                title: document.getElementById('title').value,
                subtitle: document.getElementById('subtitle').value,
                outline: document.getElementById('outline').value,
                progress: document.getElementById('progress').value,
                targetDate: document.getElementById('targetDate').value || '미정',
                estimatedPages: document.getElementById('estimatedPages').value || '미정'
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('proposalResult').textContent = data.data.proposal;
                    document.getElementById('evaluationResult').textContent = data.data.evaluation;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result').style.display = 'block';
                }
            } catch (error) {
                alert('오류: ' + error.message);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('proposalForm').style.display = 'block';
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
