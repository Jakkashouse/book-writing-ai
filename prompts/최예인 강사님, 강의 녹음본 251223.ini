참석자 1 08:07근데 4명을 유산하고 나니까 엄마가 몸이 어땠을까 몸이 아프잖아요.근데 그런 상태에서 저를 낳으니까 제가 미숙아로 태어났어요.그래서 지금 제 몸무게가 최대 몸무게거든요. 제 인생 최대 몸무게 특히 재수없잖아.근데 아무튼 간에 최대 몸무게인데 지금 근데 어쩔 수가 없어.나는 살이 잘 안 찌는 체질이에요. 근데 어렸을 때는 이게 너무 안 찌니까 맨날 아프고 이러는 거야.근데 그러던 친구가 초등학교 2학년 때 뭘 만나게 됐을까요?아까 대충 말했는데 축구를 만나게 되면서 제가 그때부터 갑자기 몸이 급격하게 좋아지기 시작한 거예요.그래서 체력도 엄청 좋아지고 그때부터 더 안 아프기 시작했죠.지금도 잔병치를 잘 안 해요. 근데 그 건강해진 체력을 가지고 제가 뭐 했냐면은 크레지 아케이드라는 게임을 되게 열심히 했어요.
참석자 1 08:46왜냐하면 우리 엄마 아빠가 맞벌이 하고 하셨거든요.그래서 맨날 집에서 엄마 아빠 밤 늦게 들어올 때까지 맨날 뭘 했다 내 동생이랑 크라를 했어요.혹시 크 해봤어요? 비행기라고 되게 잔인한 게임이 있거든요.물품점에 가둬가지고 질식시키는 그런 게임인데 아무튼 간에 이렇게 흐리지 않게 들을 하면서 저는 제 운연기를 보냈죠.중학생이 돼가지고 공부를 열심히 했으면 참 좋았겠지만 저의 가장 많이 갔던 곳은 도서관이 아니라 바로 이 해적 식사라는 일이었어요.그래서 여기 가가지고 막 미친 듯이 활기 치면서 열심히 게임을 했죠.그러던 중에 중학교 3학년 때 저한테 운명적인 사건이 터집니다.좋아하는 사람이 생긴 거예요. 근데 근데 이제 그냥 하는 소리가 아니라 좋아하는 사람이 생겼는데 고백을 한 번도 해본 적이 없는 거야.근데 고백을 어디서 할까 고민을 했는데 내가 맨날 걔랑 크레이지 않기를 했었거든요.
참석자 1 09:39그래서 저 채팅창으로 좋아 좀 찌질하긴 하지만 나도 좋아해라고 하면서 이야기를 하게 되었고 사귀자라고 얘기를 하게 되었고 이모티콘도 그냥 하트 이모티콘 막 난리면서 얘기를 했고 그래서 받아줬을까 안 받았을까요?안 받아 다행히 받아주셨어요. 그 이유가 있어요.이유가 있어요. 왜냐하면은 사실 걔는 제 100%였어요.왜냐하면은 중학교 1학년 때부터 제가 교회에서 찬양 리더를 했거든요.근데 걔는 피아노 치는 친구였어요. 그리고 우리 둘은 늘 거울로 이어져 있었어요.제가 거울을 보면서 딱 이러면은 그 걔가 띠리리 하면서 막 이렇게 한단 말이야.이거를 3년 동안 하다 보니까 처음에 친구였는데 친해지게 되고 크레이즈 아키를 하게 되고 버디보디라고 옛날에 그런 네이트 이런 게 있었거든요.채팅을 하면서 친해지게 되고 그러다가 갑자기 좋아하는 마음이 뻥 생기면서 고백을 어디서 했다 카에서 했다.그리고 다행히 받아줬다. 그래서 제가 첫사랑과 첫 연애를 중학교 3학년 때 할 수 있었죠.
참석자 1 10:43그러고 나서 우리가 고등학생이 되었는데 고등학교에 딱 갔을 때 이제 뭘 보면은 시험을 보잖아요.시험을 봤는데 물이 아니에요. 배우들이에요. 아무튼 간에 시험을 봤는데 제가 나름 공부를 열심히 했거든요.크리샤키도 많이 했지만 열심히 바닥바닥 벼락치기 했는데 내 여자친구가 그때 전교 9등을 한 거야.500명 중에 잘했어 못했어. 겁나 잘했잖아. 근데 뭔가 내가 내가 수학했는데 전교 150등이었었거든요.근데 나쁘지는 않거든요. 나름 반에서 잘하는 편이었는데 뭔가 내 여자친구 너무 잘하니까 나도 뭔가 잘해야겠다라는 생각이 든 거야.그때부터 제가 뭘 했냐면은 머리를 이렇게 밀었어요.그래서 머리를 밀어가지고 완전히 반상을 해서 머리 감는 시간까지 아껴가면서 공부를 하게 되었죠.그래서 열심히 공부를 해서 제가 졸업할 때에 전교 5등으로 졸업을 합니다.얼마나 열심히 했는지 느껴지죠. 150등에서 막 올라가는 게 엄청 힘들었어.근데 중요한 게 있어요.
참석자 1 11:38그 올라가는 과정 속에서 제가 무식했거든요. 그냥 하나만 좀 직진하는 성격이었는데 그러다 보니까 연애에 소홀하게 되었고 제가 이걸 통보를 받게 되었는데 이별 통보를 받게 된 게 사실은 저는 이미 이별 통보할 것을 알고 있었고 그 이유가 제가 그 성균관대학교라는 학교의 면접을 보고 오는 길에 제 여자친구의 집 근처에 있는 왕동가스 집에 갔어요.근데 그 집이 맛집이라 줄이 길게 서 있었고 줄 앞쪽에 내 여자친구의 뒷모습이 보이고 바로 옆에 키가 크고 잘생긴 남자애가 같이 웃으면서 있는 거야.손을 잡고 있지는 않았어. 근데 되게 친해 보였어.근데 뭔가 느낌이 쎄한 거 있죠. 그렇게 해서 봤는데 내 여자친구가 맞았고 저는 차마 말을 걸지 못했고 집으로 돌아왔고 이틀 뒤에 중간고사 이틀 남겨두고 전화 통보를 받았고 그 뒤로 제가 그때가 이제 고등학교 3학년 때였거든요.제가 3년 연애를 했으니까 19살 때 헤어져서 제가 24살 때까지 걔를 못 잊어가지고 연애를 못 해요.
참석자 1 12:484년 동안 그 얘기를 4년 후에 했다는 얘기예요. 아무튼 간에 그랬는데 저의 그 시간에는 이 친구가 뭔가 소중한 추억으로 남아 있죠.근데 중요한 게 있어요. 이후에 어찌 됐든 내가 열심히 공부를 했잖아요.좋은 성적을 받았잖아요. 그러니까 저는 제가 원하는 학교에 갈 수 있었어요.그리고 제 전공이 뭐였다고 그랬죠 아까 전공해 전공해 기계제어공학이라는 전공을 선택하게 되어 있죠.사실 전공에 대한 고민을 하고 계시는지 모르겠는데 나는 지금 대학교 어디 전공할지 이미 선택했다.오 머리는 숨 내쉬고 나는 아직 조금 고민 중이다. 그렇죠 고민 중인 사람이 더 많죠.좋아요. 감사합니다. 선대를 해주시고. 아니 사실 우리가 청소년 시절을 고민 많이 하고 선택하면 좋겠는데 별로 선택을 안 하고 고민을 안 하고 선택하잖아.
참석자 1 13:32그러고 나서 학교 가보니까 막상 내가 선택했던 정보가 전혀 다르기도 하고 나랑 잘 맞지 않는데 이걸 바꾼다는 게 생각보다 쉽지 않은 거예요.편입을 한다거나 아니면 과를 옮기거나 해야 되는데 뭐 반출을 하거나 재수를 해야 되는데 쉬운 일이 아니라는 것이죠.그래서 제가 딱 전공을 했는데 나랑 잘 맞았을까 안 맞았을까?전혀 맞지 않았어요. 제가 직무 적성 검사 해보잖아요.제가 여기 있잖아요. 근데 내 전공이 저기 있어요.나랑 완전 맞지 않는 거야. 근데 열심히 버티고 버텼어요.근데 중요한 게 있어요. 제가 초등학교 때 뭐 좋아했다고 그랬죠 2학년 때부터 뭘 했는데 축구를 되게 좋아했어요.그리고 중학교 때 뭐 좋아했다 그랬죠. 게임을 되게 좋아했어요.근데 고등학교 때는 뭐만 했다고 그랬죠. 공부만 했다 그랬죠.그럼 축구랑 게임이 어떻게 되었을까? 내 안에 억눌려 있었어요.흑연 교육이 막 미쳐 날 뛰고 있었어. 억눌르면서 공부를 했단 말이야.
참석자 1 14:23근데 그러고 나서 대학교를 갔는데 기숙사 학교네 무슨 일이 벌어졌을까 그 누구도 나를 막을 수 없어요.그때부터 협친듯이 축구랑 게임을 하기 시작해요.제가 그때 그 배경 화면이 뭐였냐면은 홈 배경 화면이 제가 대학교 때 처음 스마트폰에 나와가지고 배경은 뭐라고 했냐면은 니가 지금 할 건 축구가 아니라 공부에 미치는 거야.존재를 알고 끊임없이 노력하는 거야. 후회할 거야.시작도 하지 마 시작했어요. 끝까지 하는 거야. 합리화 시키자.독해졌어 하고 축구하고 있었어요. 아무리 해도 내가 공부하기도 싫고 내가 대학교 시절을 어떻게 보내야 될지 모르겠는 거예요.왜 나 그냥 전공 공부가 그냥 다 싫었어요. 그러니까 솔직히 저는 그냥 자퇴하고 싶었어.너무나 이게 적응이 안 되는 거죠. 근데 그런 상황에서 어쨌든 졸업은 해야 대기업에 다닐 수 있으니까 열심히 노력해가지고 뭘 했냐면은 졸업 연구를 했죠.
참석자 1 15:09저희 졸업 연구는 아까 메이커 얘기 나왔는데 저는 3D 프린터로 만드는 게 저의 졸업 연구였어요.그래서 이거는 제가 직접 모델링한 제가 인터넷으로 노트북으로 모델링한 모델이고 이거를 새로운 형태의 3D 프린터로 구현하는 게 저의 졸업 연구였죠.어떻게 졸업 연구 잘 되어 있을까요? 어떻게든 버티고 버텼어요.사실 파트너를 잘 만났어. 파트너가 내가 에이스였거든 저는 되게 쌍발 쌍발 잘해가지고 그 과에서 자기 탑이랑만 내 파트너를 했었거든요.아무튼 간에 그래가지고 했는데 완성시킨 저의 모습은 비유빌리 필터로도 가려지지 않는 어떤 피로감이 있는 그런 상태였죠.제가 졸업 연구 끝나고 나서 셀카로 기분 좋아가지고 찍었던 사진이에요.행복해 보이나요? 여러분 행복해 보이지 않았죠.근데 그러고 나서 이제 뭐가 생겼냐면은 이제는 고민이 생긴 거야.왜냐하면 그렇잖아요.
참석자 1 15:57여러분 지금도 지금도 그래 아직 고등학교 3학년 1년 정도 남으니까 이제 그때 고민하면 되지 전공 선택 이런 고민이 되고 또 나아가서는 막상 고등학교 3학년 때 전공 선택할 때 되면은 그래도 고민이 된다.근데 어쨌든 대학교 가고 나면은 4년 동안 혹은 5년 동안 고생하고 나면은 뭔가 끝이 있잖아요.근데 회사에 가면은 무슨 일이 벌어질까 보니까 평생 이 일을 해야 될 것만 같은 그런 생각이 드는 거예요.아니 대학교 때는 그나마 괜찮아. 근데 회사에 가면은 내가 원하지 않는 일을 내가 원하지 않는 전공을 내가 원하지 않는 어떤 불행한 삶을 살 것 같은 그런 불안감이 생긴 것이죠.그때부터 고민이 시작됐어요. 언제 되어서야 졸업 연구를 마치고 나서요.지금 현재 여러분 몇 살이세요?
참석자 1 16:52나머지는 15 아무튼 간에 저 되게 많은 분들이 계시는데 저는 저 때가 26살이었거든요.즉 26 빼기 지금 여러분의 나이 현황에 대략 89년 동안 저는 제가 원하는 걸 여전히 못 찾은 그런 상태였다라는 것이죠.그런 상태에서 제가 어디를 가게 되냐면은 바로 여기를 가게 됩니다.어디를 가게 되냐면은 여 여기를 가게 돼요. 여기가 어디일까요?군대를 가게 되죠. 근데 사실 정확히 말하면 군대는 아니었고 대학교 4학년 때 이제 동원 훈련이라는 게 있어요.군대 갔다 온 사람들이 갔다 온 훈련이 있는데 제가 공부를 열심히 했으면은 4년 내내 이제 하루만 갔다 오면 되는 건데 공부를 열심히 안 해가지고 5년을 다니게 되었고 5년째에는 근처 지방에 있는 일반 병사들과 함께 2박 3일 동안 훈련을 받아야 된다라는 거야.근데 여기서 되게 제가 중요한 얘기를 하나 할 거거든요.근데 2박 3일간 훈련이 저한테 어떤 의미였냐면은 혹시 여러분 여쭤볼게요.여러분 혹시 바빠요? 안 바빠요?
