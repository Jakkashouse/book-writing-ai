참석자 1 1:26:47그래서 나 혼자 공부 잘하는 거 물론 좋아 옆에 있는 친구 공부 도와주는 거 쓸모없고 필요 없는 시간처럼 느껴질 수 있지만 굉장히 소중한 거예요.왜 내가 나중에 진짜 도움이 필요한 게 있는데 그 친구가 여러분 도와줄 수 있다니까요.그 친구가 여러분 어느 순간 우연하게 만나서 여러분에게 도움이 되는 그런 시간이 분명히 온다니까요.다 돌고 돌아야 되는 거예요. 그래서 내가 얼마나 소중한지 여러분이 잘 기억해 두시고 알아두시면 좋겠어요.사실은 오늘 강의 다 다 메시지 다 내려놓고 제일 중요한 게 이거예요.내가 얼마나 소중한지 알자. 그렇기 때문에 여러분이 관심 있고 여러분이 몰입을 하고 있고 여러분의 열정이 생기고 여러분이 하고 싶고 여러분이 행복한 그 일이 절대 소홀하게 여기면 안 되는 거예요.되게 소중한 경험이에요. 그래서 여러분이 혹시라도 길 가면서 혹시라도 삶을 살아가면서 내게 관심이 생기는 열정이 생기는 뭔가가 생긴다.그거 절대 무시하지 마세요.
참석자 1 1:27:37그렇다고 공부하지 말고 그것만 하세요가 아니라 열심히 공부하면서 그것들을 할 수 있는 시간을 여러분에게 꼭 선물해 주시면 좋겠어요.여러분이 소중하니까 진로라고 하는 게 별거 아닙니다.진로는요. 쉽게 표현하면은 나아갈 때는 진로예요.그럼 진로를 다시 표현하면 내 글자가 뭐예요? 나아갈 길이죠.그래서 진로를 찾는다라는 게 뭘 찾는 거예요? 길을 찾는다라는 거예요.그러면 진로가 없다라는 건 뭐가 없는 거야 나야 귀엽다라는 거야.그러면 길이 어디 갈지 몰라 길치들 아마 많이 느낄걸 어디로 갈지 몰라 헤매 마음이 어때?불안하고 무섭죠 그게 바로 진로가 없을 때의 느낌이라는 것이죠.근데 진로가 왜곡된 게 뭐냐면은 커리어라는 영어 단어 때문이에요.커리어하니까 무조건 직무 직업 이렇게 생각하는데 커리어라고 하는 건 사실 캐리어가 원이에요.캐리어가 뭐냐면은 마차 바퀴를 하면 마사를 뜻하거든요.마사가 옛날에는 흙길이었잖아요. 그 아스팔트 길이 아니라 흙길은 어때요?
참석자 1 1:28:28마차 바퀴가 들어오고 나면 뭐가 나아 흔적이 남죠 그게 바로 이 커리어의 어원이에요.즉 내가 지금까지 밟아온 이 길의 모든 흔적들을 우리는 커리어 즉 진로라고 얘기하고 앞으로 나아갈 나의 흔적 또한 나의 커리어 길이라고 얘기를 하는 것이죠.그래서 이걸 다시 표현하면 영어 단어를 이렇게 표현할 수 있을 것 같아요.정유 글라이 우리 인생에 여정을 뜻하는 거죠. 그래서 여행을 뜻하는 영어 단어는 트립 트래블 다양하게 있는데 얘네들은 짧은 여행을 뜻하고 긴 여행을 뜻하는 게 바로 이 정의라는 단어입니다.그래서 우리가 진로를 발견한다라는 거는 단순히 좋은 데를 갔다 전공을 샀 선택한다.좋은 직업을 얻는다가 아니라 우리가 평생 고민해야 될 내가 앞으로 나아갈 길을 정한다라고 생각할 수 있겠습니다.내가 배우자를 만나는 것도 다 진로에 포함됩니다.왜 어떤 배우자를 만나느냐에 따라서 내 진로가 바뀌고요.저도 최근에 애기가 생겼잖아요. 애기가 생기면서 진로가 완전히 바뀌어요.
참석자 1 1:29:18이 구조 자체가 완전히 바뀌어요. 그래서 우리 삶이 생각보다 우리 삶에 많은 영향을 끼친다라는 것이죠.정리해 볼게요. 길을 찾는데 그럼 우리가 길을 어떻게 찾아 평소에 우리가 여기 길을 찾으려고 하면 뭘 열지 애플리케이션 네이버 중 구글 맵, 카카오 맵을 열어요.그래서 거기다가 뭘 검색해요? 맞아요 목적지를 검색합니다.대답을 워낙 잘해 주셔서 감사합니다. 목적지를 검색하는데 그럼 GPs가 해주는 게 뭐예요?GPs 맞아요. 현희 씨 우리 너무 잘해. 현희 씨 현희 씨 출발지를 얘기하죠.그러더니 목적지랑 출발지가 기술이 돼야 길을 찾을 수 있다.맞아요. 틀려요. 맞아요. 그러면 반대로 목적지가 없어 길을 찾을 수 있어 없어 없어요.출발지를 못 찾아 GPs가 내 위치가 어딘지 몰라 길을 찾을 수 있어 없어 없다라는 거예요.그래서 우리가 우리 인생에서 길을 찾을 때 있어가지고 제일 중요한 두 가지가 뭐다 첫 번째는 목적지 두 번째는 출발지예요.
참석자 1 1:30:11그럼 이 목적지 출발지가 뭐냐 이 목적지 출발지가 정해지게 되면은 중간중간 경유지가 있거든요.버스를 갈아 탄다는데 경류장을 간다든지 여기에서 지하철로 갈아탄다든지 여러 경유지들이 있잖아요.그럼 경유지를 거쳐서 목적지에 간다는 것이 그럼 여러분에게 질문드려볼게요.여러분 우리가 우리 인생의 길을 찾는다. 이 과정 안에서 좋은 대학에 다니는 건 경유지예요.목적지예요. 경유지라는 거예요. 여러분 우리가 좋은 직업을 얻는 건 경유지의 목적지예요.경유지를 하는 거예요. 그래서 여러분 생각해 보세요.내가 지금 꿈꾸고 있는 게 경유 실은 어떻게 될까요?그리고 만약에 경유지잖아요. 그러면 제가 아까 말씀드렸죠.호기심을 가지고 질문을 던지자고 그 질문 중에서 아주 강력한 질문 하나가 있어요.그게 바로 뭐냐 왜라는 질문이에요 뭐라고요? 왜 나는 조망권이 되고 싶어요.왜에 대한 대답이 여러분 거여야 돼요.
참석자 1 1:31:02지금 여러분이 생각하고 있는 수많은 경유지들의 왜라는 질문을 던져서 그 왜라는 질문에 대한 답이 내 거여야 돼.엄마 아빠 거가 되면 안 돼 내 거여야 돼. 그리고 지금 당장 대답하기 어려울 수 있거든요.그럼 여러분이 앞으로 진로 고민이라는 건 뭐냐면은 내가 앞으로 이런 걸 꿈꾸는데 그거 내가 왜 하고 싶은지에 대한 답을 고민하는 게 바로 진로라는 거예요.그리고 그 외가 점점점점 그거에 대한 왜왜왜를 하면서 결국에는 우리 인생의 목적지를 발견할 수 있게 된 거예요.저의 목적지는 이거예요. 전 세계 청소년 청년들의 꿈을 발견하고 실현하고 지속하도록 돕는 환경을 만드는 게 저의 목적지거든요.저는 평생 죽을 때까지 일을 하고 싶고 일을 할 수 있다면 무슨 일을 할 수 있을 것 같아요.
참석자 1 1:31:41그렇기 때문에 강연이라고 그렇기 때문에 강의하고 그렇기 때문에 돈도 안 될 수도 있지만 초등학생들 계속 끊임없이 만나러 다니고 끊임없이 1대 1로 청소년들의 멘토링 하고 있는 거고 그걸 지금 끊임없이 해나가고 있는 것이 저도 편하게 살고 싶어요.근데 시청이나 교육청이랑 계속 일을 하는 거예요.왜 나는 이 친구들이 마음껏 꿈꿀 수 있는 환경을 만들어야 되니까.여러분 인생의 목적지는 과연 무엇입니까? 그 목적지는 절대 직업이 될 수 없고요.그 목적지를 알기 위해서는 여러분이 꿈꾸고 있는 그 직업에 대해서 꿈꾸고 있는 그 전공에 대해서 왜라는 질문을 던져보시고 그 왜라는 질문에 대한 답을 생각으로 휘발시켜 버리는 게 아니라 글로 작성해 보세요.옆에 있는 친구랑 이야기 나눠보세요. 그러면서 여러분의 목적지를 조금 조금씩 찾을 수 있는 힌트들을 발견할 수 있게 될 겁니다.
참석자 1 1:32:22참고로 찾을 수 있는 시점은요. 30 40대에 찾아도 늦지 않다.그렇기 때문에 지금 고등학교 때 내가 뭘 해야 될지 잘 모르겠다.그럼 그냥 공부하시면 돼요. 공부도 엄마가 뭐 할지 모르겠다.그럼 여러분이 관심 있는 거에 시간 쏟으셔도 괜찮아요.지금 당장 꾸며줘도 괜찮아요. 목적지가 없어도 지금 당장은 없어도 괜찮아요.살아 있으면 충분해요. 너무나 잘하고 계세요. 이해되셨죠?좋아요. 감사합니다. 그러면 이제 사실은 공부하는 이유가 보통은 이제 좋은 대학 간다.엄마 아빠 이제는 공부하는 이유가 좀 정리가 됐어.우리가 공부하는 이유가 뭐야? 나를 위해서요. 내가 미래에 하고 싶은 게 분명히 꿈이 분명히 생기거든요.20대가 되든 이 25살 되든 30살이든 하게 되거든.
참석자 1 1:33:03근데 그 공부하는 이유가 생겼을 때 아니면 내가 하고 싶은 게 생겼을 때 지금 내가 공부를 하는 게 도움이 될까 안 될까 돼 어떻게 도움이 되냐면은 이제 나이를 들면 들수록 뭔가 무력한 것 대비 성과를 얻는 게 생각보다 기회가 없어요.근데 지금은 뭐냐면은 학생이라고 하는 직업을 가지고 있잖아.학생이라는 직업은 어쨌든 배우는 사람이잖아. 그럼 우리가 공부를 한다라고 치자.지금 내가 전교 1등을 해야지만 능력이 있고 잘하는 게 아니라 내가 원래 100등이야.근데 90등으로 가기 위한 10등만큼의 그 노력을 했는데 10등이 올라갔다에 대한 성취 경험이 나중에 여러분이 진짜 하고 싶은 일이 생겼을 때 그다음 성취를 느낄 수 있는 그 근육으로 자리매김할 수 있게 된다.즉 좋은 대학에 가기 위한 목적이 아니라 내가 지금 노력한 것 대비 성과를 얻는 그 근육과 경험을 해보는 게 지금 우리 학생 때 너무나 경험하셔야 된다.
참석자 1 1:33:58스카이를 가야만 성공할까 아니다. 하지만 스카이를 가야 성공 확률이 높아진다.왜 걔네는 성취 근육을 많이 연습했으니까 이해되셨죠?그래서 지금 여러분이 나 앞으로 뭐 해야 될지 모르겠어 그러면은 그냥 내가 나 노력한 거 대비 성과를 얻는 성취 훈련을 한다 생각하고 공부를 해보세요.성적을 갑자기 1등 올린다 이게 아니라 조금 조금씩 한번 노력한 거 대비 성과를 얻어보는 훈련을 해보는 거지.그럼 나중에 대학교 가서 여러분이 수업 신청하고 수업을 듣고 학점을 따고 이 과정 안에서 조금 더 수월하게 이런 것들을 할 수 있을 겁니다.이해되셨죠? 네 좋아요. 고등학생 때니까 제가 조금 어렵게 말했는데 아무튼 그렇습니다.시간이 많지 않기 때문에 제가 어떤 이야기 하나만 들려드리고 마무리를 좀 해볼까 하는데요.저는 졸업하기 전에 학교에서 꿈을 이야기하는 문화를 만들고 싶었어요.왜냐하면 생각보다 대학생들이 꿈 얘기 별로 안 하거든요.
참석자 1 1:34:52근데요 제가 꿈 얘기를 하려고 하는데 그럴 기회가 별로 없으니까 그럼 행사를 만들어보자.근데 꿈 얘기하는 행사 어떤 걸 할까 하다가 꿈을 나누는 세 과시를 만들어보면 어떨까라는 생각을 하게 돼요.졸업 시즌에 근데 제가 이런 거 한다고 하니까 주변 선배들도 만디하고 교수님들도 뭐라 하고 되게 이상하게 취급했어요.왜 하라는 취업 준비 안 하고 이상한 직거래하고 있으니까.근데 저는 너무나 하고 싶었고 그래서 제가 기획서 만드는 법에 대해서도 검색을 해봤어요.왜 저는 공대생이었고 이런 걸 해본 적이 없으니까 그래서 하나하나 검색을 하면서 어떻게 하면 할 수 있을까 끊임없이 이것들을 연구하기 시작했죠.저는 이제 포항에 있는 한동대학교라는 학교를 나왔는데 거기에서 일단 제가 그런 것들을 해 나가기 시작했고 그래서 저 기획서를 만들고 나니까 검토를 받고 싶은 거야.누구한테 검토 받으면 좋을까라고 생각을 하다가 세 가지를 만든 사람한테 검토를 받으면 어떨까라는 생각을 했어요.
참석자 1 1:35:42그래서 세바시를 만든 사람을 검색해 봤더니 어떤 방송국 PD님이셨고 그래서 방송국에 또 전화를 걸었죠.그때 어디 방송국입니다. 안녕하세요 주인이라고 하는데요.그 PD 님 만나고 싶어서 연락드렸는데 세바씨 PD님 좀 바꿔주세요.잠시만요. 네 누구 PD입니다. PD님 안녕하세요 제가 어떤 어떤 사람인데요?제가 학교에 셀라스를 만들고 싶어서요. 그 PD 분 만나러 갈 수 있을까요?네 만나러 오세요. 해가지고 또 만나러 갔어요. 지금 이제 세 번째 구범준 PD님이라는 분인데 제가 또 이분을 만나서 제가 아까 제가 만들고 싶었던 학교에서 꿈을 나누는 세 가지에 대한 기획서를 보내드리고 여러 가지 이제 조언들을 만들 수가 있었죠.그리고 나서 제가 카톡에 카톡 방마다 되게 긴 장문의 편지를 올리면서 함께 이걸 만들어 갈 사람들을 모으기 시작했고 처음에 이제 대학 7명에서 8명 정도 함께 모였어요.그래서 이것들을 하나하나 만들어 가기 시작했죠.
참석자 1 1:36:31그러고 나서 홍보도 필요하다라고 생각을 했어요.그래서 장소도 구했고 혹시 학교에 가면은 대학에서 총장님 얼굴 뵈기가 되게 힘들어요.그래서 제가 총장님을 찾아갔어요. 총장님과 1시간 반 동안 학교에 비전이 왔습니다.그래서 학교에 꿈을 나누는 세 가지를 만들고 싶습니다.어필을 했고 장소 빌려달라고 샤워 샤로바이를 많이 했고 그래서 학생이 빌릴 수 없는 되게 큰 공간을 제가 빌리게 되었죠.그리고 사람들이 어쨌든 모집이 돼야 되니까 홍보를 열심히 하기 시작했고요.홍보를 하기 위해서 뭘 했냐면은 홍보를 하기 위해서 로고도 만들고 포스터도 만들고 그리고 이런 화장실 소식지도 만들어가지고 오줌 사람들한테 다 붙이고 다녔어요.그래서 길거리에서 전단지도 뿌렸어요.
참석자 1 1:37:09여러분 아시는지 모르겠지만 대학교 캠퍼스 안에서 뭔가 저런 거 하는 거 되게 쪽팔린 일이거든요.근데 저 5학년 때 졸업 시즌에 제가 저러고 있었어요.그러면서 저희가 홍보를 했는데 사람들이 처음에 많이 안 왔는데 제가 이런 영상도 만들었거든요.영상도 만들어가지고 막 학교 저희 기숙사 생활을 했으니까 기숙사 앞에 있는 큰 TV 이런 거 다 나오게 만들었거든요.그래서 처음에는 20명 30명 이렇게 막 오다가 마지막 제가 졸업하기 졸업할 때 맨 마지막 회차가 3일 차였는데 그때는 100명도 넘게 사람들이 많아 이러면서 학교의 비전이라는 얘기가 나오기 시작하고 원래는 공부 잘하는 애들만 찍는다는 졸업식 영상을 저는 공부도 별로 못했는데 사람들한테 졸업 하고 영상도 찍고 학교 책장도 가고 이렇게 하면서 학교의 비전이라는 단어가 엄청 엄청 활발해지기 시작했죠.저는 저거 딱 1학기만 하고 졸업을 했는데 아직까지도 저 동아리가 이어지고 있어요.
참석자 1 1:38:02제 친동생이 저희 학교 와가지고 같이 이어지기도 했고 제 친동생 여자친구가 또 리더가 돼가지고 이어지기도 하고 어쨌든 이 꿈에 대한 이야기를 여전히 하고 있죠.근데 제가 저것만 저기서 하고 끝난 게 아니에요. 그게 아니라 제가 2016년도 12월부터는 신촌에서 드림 디자인 콘서트라는 걸 만들어가지고 한 번도 강연 안 해본 청소년 청년이 자신만의 이야기를 30분 동안 강연을 하고 그 이야기를 가지고 참여하신 분들이 2시간 반 동안 자신들의 이야기를 떠들 수 있는 드림 디자인 콘서트라는 행사를 만들었고요.이거를 제가 신청 무료로 42번의 행사를 열었어요.보통 한 번 열면 20~30명 정도 오는데 제가 여기 오는 친구들 중에 청소년 친구들이 되게 많았어요.근데 제가 매달 가르쳤거든요. 그 당시에는 근데 그러다 보니까 이제 점점점점 애들이랑 같이 함께 이 시간을 보내는 거예요.
참석자 1 1:38:46근데 그중에서 여기 혜훈이라는 친구가 있었거든요.근데 혜훈이가 늘 밝은 친구였어요. 늘 밝고 깜빡 맨날 듣고 늘 열심히 참여하는 친구였는데 어느 날 혜훈이가 저한테 찾아와요.19살이 되었던 해였어요. 그리고 19살 11월 딱 이때쯤이었어요.대표님 저 드림 디자인 콘서트에서 강연을 하고 싶어요.그래 해봐. 왜 무슨 일이야? 어떤 주제로 하고 싶어 혜원이가 알고 보니까 20살이 되면서 자기가 자살을 할 거래요.목숨을 끊은 건데 죽기 전에 억울해서 안 되겠대요.사람들 앞에 내 얘기를 하고 싶대요. 전 충격받았어요.왜 난 늘 다였고 빛나는 친구라고 생각했는데 무슨 얘기지 하나씩 이야기를 들어보니까 태어나면서부터 치말라가 아니라 계모한테 길러지게 되었고 7년 동안 7살이 될 때까지 아주 극심한 아동 폭력과 학대를 당한 거예요.
참석자 1 1:39:37봄부터 시작해가지고 애를 거꾸로 뒤집어가지고 베다 베란다에 선들이 가지고 별짓을 다 7살이 되었을 때 친엄마가 데리고 갔는데 여전히 똑같이 아이를 학대하기 시작했고, 맞고 폭언해 욕설에 이 아이가 버틸 수가 없어 가지고 우울증도 없고 막 이런 건 기본이고 늘 손목에는 늘 긴 파라이버거든.근데 손목에 군대를 차고 있더라고 자해를 하지 않고는 견딜 수 없는 그런 시간을 버텨온 거예요.버티고 버티다가 친엄마가 이 아이를 두고 다른 한 사람 떠나게 되었고 근데 그냥 떠난 게 아니라 이 모든 생활비를 주지 않고 떠났기 때문에 월세부터 시작해가지고 모든 생활비는 이 친구가 혼자 고등학교 3학년한테 감당을 해야만 했고, 학교 끝나면 4시에 끝나면 바로 알바 시작해가지고 저녁 제대로 못 먹고 새벽 3시까지 알바하고 아침에 또 일어나서 학교 가고 이 생활을 19년 19살 내내 반복했던 거예요.버티고 버티다가 도저히 안 되겠다. 내 일은 죽어야지 하고 저한테 찾아온 거죠.
참석자 1 1:40:36내 앞에서 닭똥 같은 의문을 툭툭 흘리면서 얘기하는데 제가 웬만하면 공감 잘하거든요.강의에 공감조차 할 수 없는 얘기들이었어요. 혜원이를 위해서 행사를 좀 크게 열다는 생각을 했죠.원래는 20~30명 정도를 규모로 열었다가 큰 공간을 빌렸어요.돈이 필요하겠죠. 후원금을 모집을 하게 되었고 원래는 50만 원 정도 필요했었는데 150만 원 정도가 모이게 되고 그래서 혜훈이를 위해서 이런 아티스트 분들을 초대해 가지고 힐링할 수 있는 그런 공연도 하고 큰 공연장으로 돌리고 이게 바로 그때의 모습이거든요.혜훈이의 모습인데 거의 100명 가까이 되는 사람들이 와가지고 이 강의를 듣게 됐죠.여러분 당시 할머니가 19살이었어요. 본인의 힘듦과 우울에 대해서 이야기했고요.당시 강의 주제가 우울한 나 호덕이기라는 주제였어요.근데 그 얘기를 듣고 거기 모인 청소년 청년들이 얘보다 언니 오빠들도 다 우는 거예요.위로를 받는 거예요.
참석자 1 1:41:24근데 그때 혜원이가 깨달았대요. 내 슬픔과 고통과 우울이 누군가에게는 위로가 될 수 있구나라는 걸 깨달았대요.혜원이는 지금 어떻게 됐을까요? 그때가 2018년이었거든요.혜원이가 그 뒤로 여성 청소년 상담센터라는 곳에서 돈도 거의 안 받아가면서 3년 동안 본인처럼 힘들어 보인 이 여성 청소년들을 상담해 주는 일을 해요.하다 보니까 상담에 대한 관심이 생기고 더 공부하고 싶어서 대학교를 다시 준비했고요.동국대학교랑 경희대학교 상담학과에 있게 보내고 동국대학교 상담학과에 들어가게 된 거죠.얼마 전에 졸업을 했는데 전체 수석으로 졸업을 했고 지금은 본인처럼 힘들어 하는 친구들을 도와주는 일뿐만 아니라 강사 일도 하면서 저랑 같이 일을 하기도 하고 얼마 전에 저희 집에 와가지고 우리 애기 놀아주기도 하고 이렇게 삶을 살았고 있죠.
참석자 1 1:42:08제가 만약에 엄마 아빠가 원하는 그 대기업을 가고 우리 행복한 사람 당연히 평범하게 열심히 행복하게 돈도 많이 벌면서 잘 살 수 있었겠지 하지만 내가 진짜 내 마음을 울리는 내가 진짜 하고 싶은 내가 진짜 이 일을 하면 행복하겠다 싶은 어떤 일을 하기 시작할 때 이 일을 통해서 어떤 생명 생명을 살릴 수도 있겠다라는 생각이 들면서부터는 절대 이 일을 제가 포기할 수 없게 되었던 것 같아요.근데 저만 그런 게 아니라 생각보다 이렇게 살아가는 사람들이 충격받았어요.내가 아는 세상 속에서는 늘 그냥 주어진 거 열심히 하면서 삶은 그냥 평범하게 살아가는 사람들이 많다라고 생각했는데 본인만의 삶을 발견하고 본인만의 꿈을 가지고 본인처럼 힘들어 보이는 사람들을 도와주면서 진짜 멋지게 살아가고 있는 사람들이 생각보다 많이 있더라고요.저는 여러분에게 그래서 제안 드리고 싶은 거죠. 보통 제가 강의를 하면은 100명 중에 한 명이 이제 좀 변화되고 싶다고 찾아오거든요.
참석자 1 1:43:02질문도 하고 여러 가지 얘기하고 연락처도 주고받고 하는데 그렇게 찾아오는 100명들이 또 모여서 그중에 한 명이 뭔가를 해 그리고 변화가 돼 실제로 뭔가 했다고 저한테 연락이 또 와 근데 그렇게 보면은 대략 1만 명 만나면 한 명이 진짜 변화되더라고요.그럼 저는 사실 되게 비효율적이거든요. 1만 명을 만나야지만 한 명이 변화될까 말까 하니까 근데 또 느꼈던 게 그 한 명이 나머지 9999명을 변화시킬 수 있더라고요.그럼 제가 지금 이 일을 왜 하냐 여러분 앞에 주무시는 분도 계시고 이 일을 왜 하냐 여기 있는 사람 중에 한 명이라도 오늘 내 이야기가 마음에 와닿고 씨앗이 심겼다면은 공부를 하다가 어느 순간 20살 되고 25이 되고 어느 순간 그 꽃이 발화가 되면서 나 이런 거 하고 싶다.그때 애초에 강사님이 이런 얘기했었지 그 순간에 의해서 제가 지금 이 일을 하고 있는 것 같아요.
참석자 1 1:43:46그래서 저는 지금도 되게 행복하고 여러분에게 이 이야기를 하는 이 순간도 너무 기쁘고 너무 흥분되고 뭔가 재미있고 짜릿한 것 같습니다.그래서 오늘 제 이야기를 끝까지 잘 들어주셔서 너무나 감사드리고요.어느새 2시간이 훌쩍 지났어요. 그래서 지금이 딱 셋이거든요.네 그래서 뭐 짧고도 또 긴 시간이었지만 오늘 저희 이야기 중에 하나라도 여러분 안에서 조금이라도 위로받고 또 마음에 와닿고 도움이 되는 게 있었다면 참 좋지 않을까 생각을 합니다.긴 시간 동안 잘 들어주셔서 너무나 감사드리고요.여러분의 여러분의 꿈과 여러분의 앞으로의 길을 응원합니다.감사합니다.

